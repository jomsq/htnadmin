# Rendered by the nginx image's envsubst step: ${API_UPSTREAM}, ${NGINX_RESOLVER} and ${TRUSTED_PROXY_CIDR} come from env
# (defaults in the Dockerfile). Only variables that are set are substituted, so nginx's own variables are left alone.

# Keep the scheme set by a TLS-terminating proxy in front of this container (the API needs
# X-Forwarded-Proto=https in Production for Secure cookies); fall back to our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Secret tokens in proof-upload links (/pay/<token>, /api/public/proof/<token>) never reach the access log, including
# as the Referer of the page's own asset and API requests.
map $request_uri $masked_request_uri {
    default                                 $request_uri;
    "~^(/pay/|/api/public/proof/)"          "$1[token]";
}
map $http_referer $masked_referer {
    default                                 $http_referer;
    "~^(https?://[^/]+)?(/pay/)"            "$1$2[token]";
}
log_format htn_masked '$remote_addr - $remote_user [$time_local] "$request_method $masked_request_uri $server_protocol" '
                      '$status $body_bytes_sent "$masked_referer" "$http_user_agent"';

# Proof-upload pages must not be indexed. add_header skips empty values, so other paths get no header.
map $request_uri $robots_tag {
    default                                 "";
    "~^/pay/"                               "noindex, nofollow";
}

server {
    # IPv4 only: an unconditional [::]:80 listener makes nginx exit on hosts with IPv6 disabled.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/access.log htn_masked;

    # The real client address when a TLS terminator / load balancer sits in front of this container: trust its
    # X-Forwarded-For only from TRUSTED_PROXY_CIDR (default 127.0.0.1/32 = nothing in front). The API rate-limits per
    # client address, so without this every client would share the proxy's bucket.
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Security headers. Locations below must not use add_header, or these stop being inherited.
    # HSTS belongs on the TLS-terminating proxy, not here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag $robots_tag always;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: forwarded unchanged (keeps the /api prefix). Resolving through Docker's DNS at request
    # time lets nginx start even when the api container is not up yet.
    location /api/ {
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $api_upstream http://${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (don't append): the API rate-limits by this address, so a client-supplied X-Forwarded-For
        # must never reach it. $remote_addr is already the real client when a trusted proxy is in front (realip above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html, which is never cached.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
