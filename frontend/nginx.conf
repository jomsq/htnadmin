# Rendered by the nginx image's envsubst step: ${API_UPSTREAM} and ${NGINX_RESOLVER} come from env.

# Keep the scheme set by a TLS-terminating proxy in front of this container (the API needs
# X-Forwarded-Proto=https in Production for Secure cookies); fall back to our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # IPv4 only: an unconditional [::]:80 listener makes nginx exit on hosts with IPv6 disabled.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Security headers. Locations below must not use add_header, or these stop being inherited.
    # HSTS belongs on the TLS-terminating proxy, not here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: forwarded unchanged (keeps the /api prefix). Resolving through Docker's DNS at request
    # time lets nginx start even when the api container is not up yet.
    location /api/ {
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $api_upstream http://${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html, which is never cached.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
