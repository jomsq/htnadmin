name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend:
    name: Backend (.NET build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: htn
          POSTGRES_USER: htn
          POSTGRES_PASSWORD: htn   # throwaway CI-only database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U htn -d htn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests use this when set; Testcontainers uses the runner's Docker service otherwise.
      HTN_TEST_DB: Host=localhost;Port=5432;Database=htn;Username=htn;Password=htn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.*.props', 'backend/**/packages.lock.json', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/Htn.sln

      - name: Build
        run: dotnet build backend/Htn.sln -c Release --no-restore

      - name: Test
        run: dotnet test backend/Htn.sln -c Release --no-build --logger "trx" --results-directory backend/TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults
          retention-days: 7

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker images (build only)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        # -q: validate without printing the resolved config (it would include env values).
        env:
          POSTGRES_PASSWORD: ci-placeholder
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: final
          push: false
          tags: htnadmin-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image (prod)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          push: false
          tags: htnadmin-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
