# HTN Admin local stack: db (Postgres 17), api (.NET 10), web (Vite dev server).
#   cp .env.example .env && docker compose up -d --build
# Local tweaks (ports, polling, extra env) go in docker-compose.override.yml, which compose
# picks up automatically. Don't edit this file for machine-specific changes.
name: htnadmin

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: htn
      POSTGRES_USER: htn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # loopback only; the database is not exposed to the LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htn -d htn"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      target: final
      args:
        SDK_IMAGE: ${SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet:10.0}
    image: htnadmin-api:dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Db: ${ConnectionStrings__Db:-Host=db;Database=htn;Username=htn;Password=${POSTGRES_PASSWORD}}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
      MAILTRAP_MODE: ${MAILTRAP_MODE:-sandbox}
      MAILTRAP_INBOX_ID: ${MAILTRAP_INBOX_ID:-}
      MAIL_FROM: ${MAIL_FROM:-HackTheNorth.PH <no-reply@hackthenorth.ph>}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-}
      App__PublicBaseUrl: ${App__PublicBaseUrl:-http://localhost:5173}
      Storage__Path: /app/uploads   # uploaded logos (PNG); the `uploads` volume below
      # Sample accounts (incl. a Board login with a published password) are seeded only when BOTH this is true
      # AND ASPNETCORE_ENVIRONMENT=Development.
      Seed__Dev: ${SEED_DEV:-true}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"   # loopback only: dev defaults (seeded accounts, no Board 2FA) must not reach the LAN
    healthcheck:
      # Same check as the image HEALTHCHECK: a real HTTP request to /health that must return 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./frontend
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    image: htnadmin-web:dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY: http://api:8080
    volumes:
      - ./frontend:/app          # hot reload from the host source tree
      - /app/node_modules        # keep the image's node_modules (refresh with `up -d --build -V`)
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"   # loopback only (add a LAN binding in docker-compose.override.yml if you need one)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  uploads:
